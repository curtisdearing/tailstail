name: Tailstail fantasy projections

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fantasy-weekly.yml
      - site/**
  workflow_dispatch:
    inputs:
      season:
        description: Optional NFL season override (1999-2099). Makes the run DIAGNOSTIC.
        required: false
        type: string
      week:
        description: Optional NFL week override (1-22). Makes the run DIAGNOSTIC.
        required: false
        type: string
      fast:
        description: Reduced learners for a diagnostic run. Publishes nothing.
        required: false
        default: false
        type: boolean
  schedule:
    # Wednesday after practice reports and Sunday before the early window.
    - cron: "35 23 * 9-12,1 3"
    - cron: "15 14 * 9-12,1 0"

# Least privilege at the top: read-only. Each job asks for exactly the writes
# it performs, and the two deploy jobs are the only holders of `pages: write`.
permissions:
  contents: read

concurrency:
  group: tailstail-fantasy-production
  cancel-in-progress: false

jobs:
  project:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write        # release assets holding the model-state archive
    outputs:
      production: ${{ steps.mode.outputs.production }}
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_TAG: fantasy-model-state
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # Inputs reach the shell as environment variables and never as expression
      # text spliced into a script. `${{ inputs.season }}` interpolated into a
      # `run:` block is executed by bash before the script is parsed, so a
      # dispatch value of `"; curl … | sh; #` would run with GH_TOKEN in scope.
      # Validation is a separate, fail-fast step so a bad value cannot reach a
      # command line at all.
      - name: Validate dispatch inputs and classify the run
        id: mode
        shell: bash
        env:
          IN_SEASON: ${{ inputs.season }}
          IN_WEEK: ${{ inputs.week }}
          IN_FAST: ${{ inputs.fast }}
        run: |
          set -euo pipefail
          if [[ -n "${IN_SEASON:-}" ]]; then
            [[ "$IN_SEASON" =~ ^[0-9]{4}$ ]] || { echo "::error::season must be a 4-digit year"; exit 1; }
            (( IN_SEASON >= 1999 && IN_SEASON <= 2099 )) || { echo "::error::season out of range 1999-2099"; exit 1; }
          fi
          if [[ -n "${IN_WEEK:-}" ]]; then
            [[ "$IN_WEEK" =~ ^[0-9]{1,2}$ ]] || { echo "::error::week must be 1-2 digits"; exit 1; }
            (( IN_WEEK >= 1 && IN_WEEK <= 22 )) || { echo "::error::week out of range 1-22"; exit 1; }
          fi
          # A run is production only when it is the unmodified pipeline. Any
          # override or reduced-learner run is diagnostic and must not be able
          # to publish state or Pages: a --fast model writing the season ledger
          # silently corrupts every later grading comparison.
          production=true
          if [[ "${IN_FAST:-false}" == "true" || -n "${IN_SEASON:-}" || -n "${IN_WEEK:-}" ]]; then
            production=false
          fi
          echo "production=$production" >> "$GITHUB_OUTPUT"
          echo "run mode: production=$production"

      - name: Restore rebuildable fantasy history
        uses: actions/cache/restore@v5
        with:
          path: historical/fantasy
          key: fantasy-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fantasy-history-${{ runner.os }}-

      # The ESPN comparison ledger and its pre-kickoff snapshots are carried
      # between runs here rather than in the release asset: they are ESPN's
      # per-player projections, fetched under terms that grant no
      # redistribution right, and a release asset on a public repository is
      # published material. A cache is repository-scoped and published to
      # nobody. A cache miss costs the season grading series its history, which
      # the run reports; it never costs the projections themselves.
      - name: Restore the ESPN comparison ledger (never a public asset)
        uses: actions/cache/restore@v5
        with:
          path: |
            data/espn_comparison_ledger.json
            data/espn_snapshots
          key: espn-comparison-${{ runner.os }}-${{ github.run_id }}
          restore-keys: espn-comparison-${{ runner.os }}-

      - name: Report whether the ESPN grading history survived
        shell: bash
        run: |
          if [[ -f data/espn_comparison_ledger.json ]]; then
            echo "ESPN comparison ledger restored"
          else
            echo "::warning::no ESPN comparison ledger in cache; the season grading series starts fresh this run"
          fi

      - name: Restore prior fantasy state (model + projection snapshot)
        shell: bash
        run: |
          if gh release view "$STATE_TAG" --json body --jq .body > "$RUNNER_TEMP/fantasy-pointer.json" 2>/dev/null; then
            asset=$(jq -r '.asset // empty' "$RUNNER_TEMP/fantasy-pointer.json" 2>/dev/null || true)
            sha=$(jq -r '.sha256 // empty' "$RUNNER_TEMP/fantasy-pointer.json" 2>/dev/null || true)
            if [[ -n "$asset" && -n "$sha" ]]; then
              if gh release download "$STATE_TAG" --pattern "$asset" --dir "$RUNNER_TEMP" &&
                 python scripts/state_store.py restore --archive "$RUNNER_TEMP/$asset" --sha "$sha" --profile fantasy; then
                echo "restored prior fantasy state from $asset"
              else
                echo "::warning::prior fantasy state restore failed; season ESPN grading series may reset"
              fi
            else
              echo "no prior state pointer recorded; starting fresh"
            fi
          else
            echo "no prior fantasy state release; starting fresh"
          fi

      - name: Build current projections
        shell: bash
        env:
          IN_SEASON: ${{ inputs.season }}
          IN_WEEK: ${{ inputs.week }}
          IN_FAST: ${{ inputs.fast }}
        run: |
          set -euo pipefail
          args=()
          [[ -z "${IN_SEASON:-}" ]] || args+=(--season "$IN_SEASON")
          [[ -z "${IN_WEEK:-}" ]] || args+=(--week "$IN_WEEK")
          [[ "${IN_FAST:-false}" != "true" ]] || args+=(--fast)
          python scripts/fantasy_weekly.py "${args[@]}"

      - name: Verify generated contracts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, ".")
          from nflvalue.fantasy import private_boundary
          fantasy = json.loads(Path("data/fantasy_latest.json").read_text())
          public = json.loads(Path("data/fantasy_public.json").read_text())
          snapshot = json.loads(Path("data/player_projection_snapshot.json").read_text())
          assert fantasy["players"], "weekly fantasy output contains no players"
          # Everything below this line is published. The private half of the run
          # -- the league snapshot, its rosters and the personalised decision
          # card -- must not be in any of it.
          assert public["players"], "public payload contains no players"
          assert "my_team" not in public
          private_boundary.assert_public_safe(public, what="data/fantasy_public.json")
          private_boundary.assert_public_text_safe(
              Path("fantasy.html").read_text(), what="fantasy.html")
          assert not Path("_site").exists() or not list(Path("_site").glob("my_team*"))
          assert fantasy["simulation"]["simulations"] >= 1000
          assert snapshot["schema_version"] == 1
          assert snapshot["players"], "shared projection snapshot contains no players"
          comparison = fantasy["espn_comparison"]
          assert comparison["status"] in {"ok", "espn_unavailable"}
          if comparison["status"] == "ok":
              assert comparison["espn_provenance"]["retrieved_at"]
              assert comparison["espn_provenance"]["redistribution_rights"]
              assert comparison["identity"]["espn_players"] > 0
          else:
              assert comparison["error"], "an unavailable ESPN pull must carry its error"
          assert Path("data/player_projection_samples.parquet").stat().st_size > 1000
          assert Path("fantasy.html").stat().st_size > 1000
          PY

      - name: Publish checksummed fantasy state
        if: steps.mode.outputs.production == 'true'
        shell: bash
        run: |
          asset="fantasy-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          archive="$RUNNER_TEMP/$asset"
          python scripts/state_store.py pack --profile fantasy --archive "$archive"
          if ! gh release view "$STATE_TAG" >/dev/null 2>&1; then
            gh release create "$STATE_TAG" --prerelease --title "Tailstail fantasy model state" --notes "{}"
          fi
          gh release upload "$STATE_TAG" "$archive"
          python scripts/state_store.py pointer --profile fantasy --archive "$archive" --asset "$asset" --output "$RUNNER_TEMP/fantasy-state.json"
          gh release edit "$STATE_TAG" --notes-file "$RUNNER_TEMP/fantasy-state.json"

      - name: Keep the eight newest fantasy states
        if: steps.mode.outputs.production == 'true'
        shell: bash
        run: |
          gh release view "$STATE_TAG" --json assets --jq '.assets | sort_by(.createdAt) | reverse | map(select(.name | test("^fantasy-state-[0-9]+-[0-9]+\\.tar\\.gz$"))) | .[8:] | .[].name' |
          while read -r old_asset; do
            [[ -z "$old_asset" ]] || gh release delete-asset "$STATE_TAG" "$old_asset" --yes
          done

      - name: Save refreshed fantasy history
        if: steps.mode.outputs.production == 'true'
        uses: actions/cache/save@v5
        with:
          path: historical/fantasy
          key: fantasy-history-${{ runner.os }}-${{ github.run_id }}

      - name: Save the ESPN comparison ledger
        if: steps.mode.outputs.production == 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            data/espn_comparison_ledger.json
            data/espn_snapshots
          key: espn-comparison-${{ runner.os }}-${{ github.run_id }}

      # The artifact carries model state and ESPN snapshots, so it is named by
      # run mode: a diagnostic archive must never be mistaken for the season's
      # real ledger when someone downloads one months later.
      - uses: actions/upload-artifact@v6
        with:
          name: tailstail-fantasy-${{ steps.mode.outputs.production == 'true' && 'production' || 'diagnostic' }}-${{ github.run_id }}
          retention-days: 30
          path: |
            data/fantasy_public.json
            data/fantasy_model.joblib
            data/player_projection_snapshot.json
            data/player_projection_samples.parquet
            reports/fantasy_model_card.json
            fantasy.html

      - name: Prepare Tailstail Pages site
        if: steps.mode.outputs.production == 'true'
        run: |
          mkdir -p _site
          cp fantasy.html _site/index.html
          # The allow-listed subset, not the full payload: data/fantasy_latest.json
          # carries the personalised my_team contract and this directory is served
          # to the public internet.
          cp data/fantasy_public.json _site/fantasy_latest.json
          cp data/player_projection_snapshot.json _site/player_projection_snapshot.json
      - uses: actions/configure-pages@v5
        if: steps.mode.outputs.production == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.mode.outputs.production == 'true'
        with:
          path: _site

  deploy-dashboard:
    if: github.event_name != 'push' && needs.project.outputs.production == 'true'
    needs: project
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Tailstail dashboard
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-landing:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare honest offseason landing site
        run: |
          mkdir -p _landing
          cp site/index.html _landing/index.html
          cp reports/fantasy_monte_carlo_history.json _landing/model-audit.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _landing
      - name: Deploy Tailstail landing site
        id: deployment
        uses: actions/deploy-pages@v4
