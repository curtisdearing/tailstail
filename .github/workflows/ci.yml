name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff==0.15.22
      # Curated ruleset (ruff.toml). Behaviour-changing lints are disabled there
      # on purpose -- see the header in ruff.toml for why.
      - run: ruff check .

  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest

      # Selection is by marker, never by a list of filenames. `tests/conftest.py`
      # marks every test `offline` unless it is registered there as needing the
      # gitignored history corpus or live network, so a new test file is picked
      # up automatically and excluding one is a reviewed edit to that registry.
      # `test_ci_selection.py` fails if this command stops being marker-driven.
      - name: Run every data-independent test
        run: pytest -q -m offline

      # Excluded suites still have to collect: a syntax error or a bad import in
      # a history-dependent test would otherwise never be seen until someone ran
      # it locally with the corpus present.
      - name: Collect the excluded suites (import check only)
        run: pytest -q --collect-only -m "needs_history or needs_network" > /dev/null
